; CYD 2-USB (ESP32-2432S028, ST7789 variant)
; Phone-like shell: WiFi + text browser + SD/flash file explorer + cache + effects + games
[env:cyd2usb]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default.csv
board_build.filesystem = littlefs

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

build_flags =
    -Os
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    ; silences TFT_eSPI's "TOUCH_CS not defined" warning; touch is driven
    ; separately via XPT2046_Touchscreen on its own SPI bus, not through TFT_eSPI
    -DTOUCH_CS=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    ; colours inverted on your panel?      -> -DCYD_INVERT=0
    -DCYD_INVERT=1
    ; red/blue channels swapped?           -> add: -DTFT_RGB_ORDER=TFT_BGR
    ; SD card not detected on your board?  -> edit SD_CS/SD_SCK/SD_MISO/SD_MOSI in include/config.h
